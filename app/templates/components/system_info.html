<!-- System info component (HTMX partial) -->
<div class="space-y-4">
    <div>
        <h3 class="text-sm font-semibold text-gray-400 mb-2">Application</h3>
        <dl class="space-y-2">
            <div class="flex justify-between text-sm">
                <dt class="text-gray-500">Name</dt>
                <dd class="text-white font-medium">{{ info.app_name }}</dd>
            </div>
            <div class="flex justify-between text-sm">
                <dt class="text-gray-500">Version</dt>
                <dd class="text-white font-medium">{{ info.app_version }}</dd>
            </div>
            <div class="flex justify-between text-sm">
                <dt class="text-gray-500">Debug Mode</dt>
                <dd class="text-white font-medium">
                    {% if info.debug %}
                    <span class="text-yellow-400">Enabled</span>
                    {% else %}
                    <span class="text-green-400">Disabled</span>
                    {% endif %}
                </dd>
            </div>
        </dl>
    </div>

    <div class="border-t border-gray-700 pt-4">
        <h3 class="text-sm font-semibold text-gray-400 mb-2">Configuration</h3>
        <dl class="space-y-2">
            <div class="flex justify-between text-sm">
                <dt class="text-gray-500">Max Cameras</dt>
                <dd class="text-white font-medium">{{ info.max_cameras }}</dd>
            </div>
            <div class="flex justify-between text-sm">
                <dt class="text-gray-500">Max Loaded Models</dt>
                <dd class="text-white font-medium">{{ info.max_loaded_models }}</dd>
            </div>
            <div class="flex justify-between text-sm">
                <dt class="text-gray-500">NPU Core Mask</dt>
                <dd class="text-white font-medium font-mono">{{ info.npu_core_mask }}</dd>
            </div>
        </dl>
    </div>
</div>

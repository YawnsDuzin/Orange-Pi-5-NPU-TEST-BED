<!-- Log entries component (HTMX partial) -->
{% if entries %}
<div class="space-y-0.5">
    {% for entry in entries %}
    <div class="font-mono text-xs
        {% if entry.level == 'ERROR' %}text-red-400
        {% elif entry.level == 'WARNING' %}text-yellow-400
        {% elif entry.level == 'INFO' %}text-green-400
        {% elif entry.level == 'DEBUG' %}text-gray-500
        {% else %}text-gray-400{% endif %}">
        <span class="text-gray-600">{{ entry.timestamp.strftime('%H:%M:%S') }}</span>
        <span class="text-gray-500">[{{ entry.level }}]</span>
        <span class="text-gray-600">{{ entry.logger }}:</span>
        <span>{{ entry.message }}</span>
    </div>
    {% endfor %}
</div>
{% else %}
<p class="text-gray-500 text-xs">No log entries</p>
{% endif %}

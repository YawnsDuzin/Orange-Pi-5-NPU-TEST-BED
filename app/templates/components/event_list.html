<!-- Event list component (HTMX partial) -->
{% if events %}
<div class="space-y-1">
    {% for event in events %}
    <div class="flex items-start gap-2 p-2 rounded-lg hover:bg-gray-700/30 transition text-xs">
        <span class="flex-shrink-0 w-1.5 h-1.5 mt-1.5 rounded-full
            {% if event.type == 'detection' %}bg-blue-400
            {% elif event.type == 'roi_alert' %}bg-red-400
            {% elif event.type == 'line_cross' %}bg-yellow-400
            {% else %}bg-gray-400{% endif %}">
        </span>
        <div class="flex-1 min-w-0">
            <p class="text-gray-300 truncate">{{ event.message }}</p>
            <p class="text-gray-500 mt-0.5">
                <span class="font-mono">{{ event.timestamp.strftime('%H:%M:%S') }}</span>
                {% if event.camera_id %}
                <span class="mx-1">&middot;</span>
                <span>{{ event.camera_id[:8] }}</span>
                {% endif %}
            </p>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="text-center py-8">
    <svg class="w-8 h-8 mx-auto text-gray-600 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
    </svg>
    <p class="text-sm text-gray-500">No events</p>
</div>
{% endif %}
